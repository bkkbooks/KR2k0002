body:
  text: 禁扁卷二元王士點撰冠山塹泉經之營之於皇萬年視此茅茨次殿之扁第五上殿秦大夏甘泉阿房前漢未央前殿王莾改玉路堂金華白虎麒麟鳯凰髙門鈎弋武臺七殿並武帝作宣明廣明二殿在未央東玉堂昆德二殿在未央西宣室前殿正室也清涼一名延清室溫室三殿在未央北昭陽趙昭儀居曲臺蕭何承明萬嵗鳴鸞鵷鸞宴昵蕙草蘭林回東披香安處龍興神仙合歡朱雀一名朱鳥東平永延曾成曹參常寧壽成四車神明九華椒房通光飛翔宣德壽安獲福東明丙殿韓信椒風董昭儀居􅉅若雲光延年猗蘭即崇芳閣發越平就飛羽一作飛雨長年便殿含章已上六十殿並在未央宫中蔬圃天梁銅柱函德駘蕩春色景物滿宫中也竒華唐中可受萬人枍栺木名宫中美木茂盛馺娑缺承光已上十一殿並在建章鴻寧建平三年災明光二殿並在桂宫明光在明光宫永光三雲一名紫殿並在甘泉永壽永寧長秋長信並在長信宫中長定長樂前殿廣陽臨華永始四年災神遷椒房大夏高明通光溫室延年長亭永昌鴻臺中室宣德建始月室十八殿並在長樂宫靈波承華鳯凰溫調延休飛雲漸臺釣臺敬法清暑商門獲貙存神存仙二殿並在華隂縣顯陽廣陵王胥作光明燕剌王作溫明趙王如意作靈光魯共王作博昌含風永安並在少嬪館後漢崇德正却非章德玉堂有前後殿嘉德九龍門內孝仁董后曽居之號長樂宫宣德建武二十年置名馬式于殿前樂成承福宣室明光尚書郎奏事所顯親建始東有太倉武庫含章鳯凰銅馬清涼敬法黃龍壽安竹殿中德平朔千枝萬嵗溫德靈臺楊安廣室已上並在洛陽南宫德陽正殿在崇文門內崇德德陽東和歡安福二殿德陽內宣明溫明章德壽安含德章臺天祿溫飭崇政金商門內永寧已上並在洛陽北宫崇光華光並在芳林園華陽興嘉並在修明苑顯陽雲氣顯陽北天光明光蔬圃天德建章文昌廣德陽明雲臺甘泉白虎長秋太極宣平曹魏太極青龍三年即漢崇德殿基建始九龍即崇華昭陽太極北式乾顯陽皇后正殿黃初間作嘉福仁壽文昌含章顯陽東徽音雲氣顯陽北芙蓉九華承光乾元已上在洛蔬圃南圃並在華林清商安世已上洛陽景福建陽金光望舒羲和安昌溫房涼室並在許昌聽政永寧臨圃百子永昌德陽大昌乾象晉太極十二間建始明陽以諱改昭為明式乾徽音顯陽含章暉章崇賢仁壽殿有大方銅鏡百福章華嘉福宣光修明嘉樂芙蓉章陽百兒芳德清暑靈圃承光永寧景福延休虞淵洞冥安昌光明萬年三十一殿並在洛宫崇政太子宫崇光華光蔬圃章陽並在華林文明言思靈雲百子陽春九華青冥六朝赤烏昭明正神龍太初正禮賔臨海太極晉合殿宋文帝作含章玉燭紫極已上孝武作清曜正福仁壽文昌景福正光徽光十一殿並宋顯陽昭陽鳯莊百殿壽昌畫殿乾光並永明芳樂永壽並東昏作崇正含德九殿並齊五明寶雲慧輪三殿並梁永賢昭德乾明有覺嘉德永正溫文文思三善長春勝辨壽安承香柏梁十四殿並陳延昌七賢神仙璿明龍光延務至敬大政璇璣柏香已上四十七殿並在臺城清暑晉作宋改嘉禾華光鳯光興光並宋文作靈明宋孝武作重雲光嚴聽訟永初作臨政元嘉作玉壽東昏作光華披香光壽光昭已上十二殿並在華林園大昌靈和並在青溪正陽林光百戲並在樂遊祈年藉田靜居崇光太興無礙璿儀仙華平等芳德乾和臨雲太陽鳯華式乾崇明招婉百福壽光宣德文德宣明正麗鎮聲延德溫德麗輝嘉福延賢徽音琬琰璇明休章玉衡延華臨芳臨華文熙夕宴武德延豫太宰慧義明陽善壽金華臨光真筌宴居宣福青雲日長鵷鸞樂受崇政龍興行軍朱雀元光永貞麗日重光合歡光政聽政元龍光璧蘭林安壽元魏太華大安四年作天文天興元年作天華二年作中天三年作紫極四年作西昭陽六年作七寶永安承明元年作永安安樂二殿並始光二年作廣德貞君三年作永安北苑遊觀北苑太和安昌四殿太和元年作靈泉方山二年作坤德六合三年作思義二殿四年作乾象六合亦四年作鑒玄五年作經武十二年作太極十六年壤太華殿為之已上二十一殿並在代乾安清徽並在長安澄鑾鄴萬壽華州太極景明三年作式乾徽音顯陽明光理訴延昌元年作觀德七殿並在洛宫中嘉福靈芝釣臺之北建始東九龍西宣光南四殿皆有飛閣入湊靈芝釣臺並在西遊園清涼九華山上釣臺蓬萊山上景陽山上清暑景陽山南並在華林光極金墉崇光華林天安未央含章瑤華神德文昌樂陽板殿北齊太極昭陽即顯陽宣德即宣陽太武宣光建始嘉福仁壽四殿並天保三年作于晉陽含光金華天保七年作九龍鄴大明晉陽天統三年作修文偃武玳瑁紫微梁風含章乾象大光二殿在三殿上瑤華乾壽宇文周崇信會義含仁雲和思齊延壽太極上善正武太武大德天德乾安改紫極連珠臨光文安麟趾中有學士隋乾陽正大業志靜修文文成武安觀文流杯安福寢瑶光九州池內並在洛曲水含景景華宫內成務大順文華春林和春仁智洛宫中仁壽大寶大興中華嘉則武德觀德明德大儀𢎞徽桂華圓基澄華景華清暑澄光萃華合歡成象崇德臨芳儀鸞仁風凝芳紫鱗武成徽猷紫微香風瑤泉文思漏景含象顯仁巢鸞含涼臨華允武光辟臨光流杯凝華凝暉結綺飛宇觀風車殿臨汾車殿唐太極即隋大興武德淑景兩儀即隋中華甘露百福神龍昭慶承慶承香咸池長樂紫微嘉壽延嘉延恩萬春千秋就日臨照薰風望仙翔鳯鶴羽乘龍大吉立政文思安仁觀德凝隂𢎞文三十二殿並在太極宫含元後改大明尋復麟德一名三殿紫宸延英宣政承暉含涼拾翠還周觀德金鑾長安改長樂蓬萊會寧紫蘭含氷玄英三清碧羽白華大角綾綺長生大福咸寧玄武恩政明義承香仙居中和大和清思紫蕭珠鏡玉清承歡凝霜水香含象龍首凝暉並在東內苑觀德逮後改拆為含元殿寶慶永安並在內苑興慶大同交泰冷泉積慶義安龍池南薰新射飛仙同光長慶榮光十三殿並在興慶宫承乾垂拱戢武翠華文殿五殿並在大安宫光大明德即嘉德改顯德崇教即𢎞教麗正改集仙又改集賢承恩崇文崇仁八風一作八殿射殿九殿並在東宫咸泰德陽文思院元和嘉慶昭敬臨璧德政同文保寧興泰雲韶會宗臨光昭德保安宣明靈臺壽春宣光凝化宣和升陽會昌壽昌宣徽並在西京不見所在含元即隋乾陽武德四年焚麟德二年作乾元殿長壽三年改作明堂其北造天堂證聖二年火更造明堂號通天宫其中號端扆殿開元五年為乾元殿十年復為明堂二十七年毁明堂之上層為新殿明年改含元宣政即武成改貞觀含元北徽猷貞觀北文思莊敬飛香觀文流杯潦渠九曲𢎞徽大儀集仙澄華凝華安福仁智蔭殿觀象臺下東西二十五丈南北二十丈壁厚三丈五殿下有五殿上合為一亦隂殿也殿厚五丈髙九丈瑤光儀鸞百戲五明集賢長壽仙居儀嵗同明德昌洛城飲羽延祥延壽六合𢎞福改崇福思政即太極也崇勳六殿並在洛陽宫中觀風正殿東向仙居甘露麟趾麗春芬芳六殿並在上陽宫成務大順文華春林和春五殿並在芳華苑內連璧齊聖綺雲三殿並在合璧宫中含樞三陽九玄芳桂介福憲宗神御虔思宣宗憩所二殿並在洛陽報聖寺通光未央升陽在望春宫翠微正含風寢喜安儲三殿並在翠微宫玉晨成都長生飛霜明珠彈筝玉女四聖七聖鬭雞七殿並在華清宫玉華暉和儲二殿在玉華宫中九成小辛崇德咸亨大辛雲繞一作擾承恩小犢宿成微暑大犢仰雨偏樂小真講武雲寢大真觀藝大朝偃日排雲含輝避暑伏龍偃雨齊政凌隂雲缺二十八殿在九成宫披香慶善宫雍和即親親樓在十六宅含光會昌二殿在黎椒蘭慶安延喜同心含章臨華文成五代崇元梁元德晉改廣政玄德金祥萬嵗滋德晉改明德已上在汴朝元即唐含元梁改朝元後唐改含化晉又改宣德文明即唐貞觀梁改今名崇興勳梁作後唐改中興晉又改天福金鑾後唐改二儀興安梁宣威梁端明後唐含慶永芳園中延英壽慶後唐改廣壽敷政講武長春絳霄雍和已上並在洛乾福晉武德文思天清已上並在鄴保昌嘉慶永福宋大慶即梁崇元改乾元改朝元改天安改大慶無為簡賢改崇政睿思端明端拱崇孝恭先燕寧總文垂訓資政文德立政薰風清徽基春邇英玉鑾壽春延和晨曦蘭英欽明臨波宣明坤寧琳光儀鳯玉虛振芳崑華大峙乾康明暉會通四達延春齋明得一重熙宜春玉光太易孝思景福凝神溪光嘉瑞保和陽曦化成宣和玉華葆光五師集英文明垂拱凝芳雲華乾華觀文翠微祥曦承極怡神蘂珠皇儀欽先紫宸神霄凝熙燕頤湛露已上七十五殿並見汴京宫圖保慶慶壽華德二殿並在慶壽宫寶慈姒徽二殿並在寶慈宫崇慶壽康二殿並在壽慶宫隆祐慈徽二殿並在隆祐宫慈德即隆祐仁羽即慈徽壽昌三殿在慈德宫壽祺寧德宫萬安在萬安宫慈壽在慈夀宫聖瑞欽慈后居觀稼後苑思文寶政二殿在藉田穆清性智靈顧真宗御容凝和崑玉羣玉會寧成平已上在延福宫端誠熙成含德受禧臨芳五殿在青城太極安福慈福玄真金華延慶臨華述古清暉積慶真遊崇和萬嵗全真崇聖集賢清居流杯福聖崇德西涼臻祥元和嘉慶嘉德廣德清心集聖玉京清景申福延康會慶宣德明德瑤英瓊林慶雲玉英瓊津萬春太初瓊蘭元符沖和玉間含光玉宸慶基積翠右文祕省崇微福寧明慶慈元勤政延恩武信滋福大興廣政天和承明慈明隆儒三洞瓊文德隆已上六十五殿並在汴京中歸德在應天天貺泰山班瑞時巡慶寧三殿在大名壽元延聖寧華崇政寧福重壽太元祥曦延和乾文佑聖垂拱福寧景福寶慶太霄崇禧廣愛通真嘉明靈暉仙儀福慶明堂坤寧順福瑞慶神應靈休彰德熙明大成廣孝福臨玉牒集禧純福康壽膺慶選德淳熙中作復古介福明離緝熙凝機三極儲祥重徽育瑞正陽肅儀申佑無極妙道金闕寥陽長生已上四十五殿並在杭天興景靈歸德鴻慶宫二殿並聖祖天光景靈來寧景靈山慶基資福院三殿並藝祖皇武景靈靈遊山興光開元興國寺章武揚州建隆寺端命滁州六殿並太祖大定景靈天遊帝華永隆啓聖院宜聖宫中統平并州神武揚州七殿並太祖熙文景靈神藻集禧觀昭考福聖明道中作崇先奉真即壽崇真慈孝寺延聖萬壽觀全像奉神集禧觀永崇崇先一觀信武澶州保祥西京崇福宮集真華州雲臺太虛已上十四殿並真宗神御美成景靈晨霄山燕寧延福孝嚴寧治昊天六殿並仁宗昭清山治隆景靈英德三殿並英宗大明舊顯承改徽音又改今名靈德山殿二殿並神宗重光舊觀成改重光改寶慶又改今名靈臺山殿二殿並哲宗端慶欽宗承元徽宗德輝髙宗一作徵系隆孝宗美明光宗垂光寧宗章熙理宗承烈度宗太始景靈宴娭山殿二殿並宣后儷極凝真山殿二殿並太祖后輝德冷風山殿二殿並太祖后廣愛萬夀觀奉莊惠衍慶章德慈孝寺以奉章惠丹臺山殿四殿並真后繼仁靈崑山殿二殿並仁后徽音寧真山殿二殿並英后坤元舊柔明改欽儀顯光山殿二殿並神后柔儀靈娭山殿二殿並哲后順成徽后纘德欽后章祥髙后嗣徽孝后光順光后體德寧后明福景靈齋殿治平元年改迎禧大明以下並在景靈宫興光西京太祖太宗天德降真文德二殿並在洛殿聖宫重徽普安院明德章穆二后神御太極即晉宣德天興文明垂拱即梁延英廣壽明德二天和三崇徽天福明福門外太清正寢在天福後思政太清第二延春三武德即後唐端明西北金鑾即後唐二儀壽昌即梁雍和金鑾第二玉華三甘露四長