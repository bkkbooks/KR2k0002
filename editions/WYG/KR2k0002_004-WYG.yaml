body:
  text: 禁扁卷四元王士㸃撰迺文迺武對越天工星敶拱極協和爾衷次省之扁第九省前漢中書尚書後漢中書尚書晉門下散騎著作六朝集書齊祕書梁與尚書中書集書門下為五省永福華林文德壽光栖省愽士一名諸生典客北齊中侍中隋内史即中書改内書殿内内侍唐紫微即中書文昌即尚書唐以尚書中書門下為三省武氏改其名殿中與内侍祕書合三省為六省本朝中書尚書館欵留賔使曰館殷陽館秦射熊昭王作前漢東館甲館柸館桂館繭館鹿館涿沐射熊長楊承光建章包陽犬臺當路磃氏飛亷平樂上蘭已上十三館在上林長平池陽白鶴孝武園雲林霍后自昭臺宮徙居益壽延壽元封二年作二館于甘泉昭靈髙靈首山宮承恩迎風甘泉山後寒露髙光儲胥甘泉臨池麒麟朱鳥龍興含章忘憂梁孝王作少嬪逺條後漢髙安洛陽城内平樂曹魏𤣥武渭陽二館明帝作于洛晉繁昌延祚千禄建康顯昌壽安五館並在洛六朝任子吳貢計樂游儲胥凌囂宋一作凌敲𤣥館史館二館元嘉置總明太始至齊有之商飈齊武帝立于秣陵岡崇虚齊士林梁大同七年作顯仁髙麗使居之集雅百濟使居之顯信土蕃使居之職方尉佗使居之行人北方使居之來逺蠕蠕使居之六館並梁作元魏金陵吳使居之燕然北使居之扶桑東使居之崦嵫西使居之四館並在洛南仙人蓬萊山上露寒常娥峰上北齊上林中有學士唐脩文武德初置後改𢎞文神龍初改昭文二年改脩文景龍二年改昭文開元七年改脩文𨽻門下習藝即文學館如意初改珠英則天置崇𤣥崇文即文賢屬左春坊廣文仙春四方司成即國子監宋保壽粹和二館在汴介真瑞真崇真迎真延真南真崇祐繙經冷香文杏崇禋茹芝晨華賢德班荆同文金㑹同歸仁同文恩華璨文來寧來同懷德肅儀本朝㑹同崇文昭文襍長存即霸橋館王莽改定安即明光宮王莽改以居孺子嬰部曹伍分治曰部後漢選部曹魏吏部金部倉部駕部庫部比部晉起部六朝祠部晉北齊膳部宇文周刑部計部虞部隋民部禮部兵部憲部工部唐戸部文部武部本朝吏部戸部禮部兵部刑部工部寺嗣事在公曰寺公務專治曰寺前漢奉常改太常光祿衛尉宗正太僕大理改廷尉鴻臚司農少府後漢侍中即門下省晉祕書六朝大匠太府大舟北齊昭𤣥國子唐司禮即太常司宰即光祿又改司膳司衛司屬司馭詳刑司賔又改同文司稼司府遼崇祿本朝武備光祿太僕長信世祖鄂通長秋武宗鄂通承徽仁宗鄂通長寧英宗鄂通寧徽明宗鄂通長慶成宗鄂通尚乗尚舎衛護翼守兵曰衛唐玉鈐金吾奉宸武威鷹揚豹韜典戎崇掖鶴禁奉裕本朝宗仁隆鎮宣忠龍翊監臨視稽違曰監後漢祕書隋國子唐成均國子内府尚方軍器繕工司津控鶴龍馬閑駒橐泉騊駼承華本朝太府章佩中書祕書利用經正度支典寶藝文甄用典祓司禋膠飭物致文曰膠虞東膠西膠庠考禮詳事曰庠周上庠下庠雍四周在水曰雍周璧雍學效學益能曰學夏左學右學瞽宗殷東序西序周成均前漢太學後漢太學鴻都門學六朝儒學𤣥學文學史學唐國子太學四門律學書學算學宋宗學武學醫學襍宣文宣敎崇儒崇訓四小學並石勒司宋閤門引見通進殿前儀鸞翰林金侍儀本朝司農留守崇福都功德内正中瑞廣惠延慶府正翊正徽懿章慶侍儀家令儀鳳拱衛衛候敎坊内􅌠修内典軍祕應漕運供膳掌薪八作覆實羣玉廣誼龍翔營繕興瑞署表識明判曰署前漢五官左署右署虎威章溝大樂太祝太􅌠太史太卜太醫均官都水食官静室大饔衛士旅賁大廐未央家馬車府路軨騎馬駿馬大行譯官别火内官大倉均輸平凖都内耤田幹官鐵市尚書符節太官湯官導官樂府若盧考工左弋居空胞人鉤盾尚方御府永巷牛官暴室宦者内者中疉寺互武庫都舩石庫左校右校前校後校中校主章九譯上林御羞禁圃楫櫂鐘官技巧六廐辨銅衡官農倉甘泉市㕑雲疉四市廩犧掌畜廱㕑後漢嘉德丙署崇德鈎盾掖庭朔平承祿園圃畫堂黃門虎賁曹魏黃門晉通章虎賁中署黃門六朝乗黃耤田銅螭綾絹大弩簟蓆梅根典書符節公車北齊中書京邑典膳齋師公車典農鼓吹駞冶細作大樂武庫守宮中盾食官典食清潭太官奚官左龍右龍中宮司染典寺籍田太司隋公車郊祀太廟太祝平凖太樂驊騮武庫典客左藏太倉尚方典農常平右藏廣藏黃林上林龍廐衣冠左校右校導官典牧肴藏崇𤣥太卜車府清商司犧良醖掌醢甄官廩犧唐珍羞武器率更司儀中校河渠弩坊甲坊本朝典設典膳尚珍廣濟豐潤濟民昌國豐贍天樂永和常和雲和安和和聲尚工賛儀局治小有拘曰局北齊主衣尚食尚藥廟戸屬太常隋符璽宮門殿内尚藥䘖府尚食尚舎尚乗尚輦尚衣内者唐尚食尚舎尚衣尚藥尚乗尚輦尚宮尚儀尚寢尚功著作司閨司則司饌掖庭宮闈奚官内府内僕宋來儀艮嶽畜禽所本朝尚食尚飲尚醖折馘廣成儀鑾供徽典飲所治事以處曰所宋安邊勑令軍器玉牒國信日厯㑹要御膳講筵本朝都成驛置驛遞傳曰驛宋迎鑾鄆州臨􅈶翔鑾沙溝回鑾葛石太平知溝並真宗因東封改塊金山粟備民養賢惟儉惟恒王天下先次府之扁第十府五帝天府唐商土府水府草府木府器府貨府周䇿府記府盟府太府内府外府玉府天府泉府膳府酒府前漢靈金内府祕府書府樂府上林記府隋通樂唐雲韶即内敎坊如意中改奉宸控鶴監崇先同軌寶圖二府屬金吾武安武成二府屬左右衛萬敵萬年永固屬驍衛廣濟宋文昌元豐七年新省成號曰文昌府省部合三千一百間大晟崇寧四年置主大樂東府西府二府熙寧三年作左右掖門南之東凡八位以處宰執第一位一百五十六間今位一百二十三間本朝内史雲需上供侍正常侍王相宣農仁虞降祥照功襍永和崇賢天䇿三府並馬殷庫固兵貯物曰庫前漢武庫六朝脂澤臺城内茭若南武北武唐瓊林大盈維城延資齊天宋激賞本朝廣源寶源綺源賦源廣貯生料財用輔用器備收支平盈壽武利器廣勝資乗内藏左藏右藏御帶異珍資成資用法物儀從中興武功承天宣惠廣樂福寧奉宸廣德藏珍文成供需備用尚用豐衍藝林資善永需襍齊天常盈全武廣潤四庫並王建藏受藏富有曰藏前漢靈金後漢中藏晉左藏右藏北齊希藏藥藏宇文周武藏隋廣藏宋内藏倉贏粟蓄餘曰倉前漢太倉細柳嘉倉晉常滿六朝龍首常平宇文周神倉黍倉稷倉稻倉豆倉麥倉米倉鹽倉唐含嘉東京永豐如京西京宋豐儲本朝永備景運醴源萬斯南北二倉千斯維億相因既盈既積盈衍太積廣衍順濟永濟永平豐潤廣貯廣濟豐實通濟豐穰積貯大有屢豐延豐富有足食盈止廼積廣儲樂歳及秭慶豐及衍富儲富衍有年已上通州廣盈南北二倉永備南北二倉大盈充溢崇墉恒足豐儲豐積既備大稔大京足用已上河西務惠逺永積萬盈廣積永備襍廣濟南唐廩導粟以藏曰廩襍御廩魯房駟御天其用如龍六轡駪駪以祀以戎次閑之扁第十一閑防牧芻秣曰閑唐飛黃吉良龍媒騊駼駃騠天苑内駒犇星飛龍廐蕃息聚羈曰廐秦蘭池前漢未央承華騊駼騎馬路軨大廐長樂翠華大輅果馬軛梁大宛後漢承華漢安元年作騄驥光和四年作並在洛城内唐飛龍上陽祥麟鳳花鵷鸞吉良六羣襍延廐魯宮廐中廐並楚皁柈􅌴以圉曰皁北齊駮皁圈豢畜以垣曰圈秦獸圈狼圈前漢虎圈豕圈宸居穆穆游思林麓相彼為山一簣斯覆次山之扁第十二山相築土石曰山前漢蓬萊方丈瀛洲三山並在太液池中百靈梁菟園後漢少華西園六朝景陽元嘉二十三年築於華林園武壯元嘉中築于華林元魏景陽天淵池西南蓬萊天淵池内唐㑹昌即驪山又改昭應宋象瀛本朝萬歳襍景雲慕容熙作巖䟽通巉峭曰巖前漢落猿宋玉京獨秀太平滴翠本朝翠巖岫石竁容潜曰岫前漢栖龍宋杏岫嶼囬淵桀峙曰嶼金瀛嶼島山宛處淵曰島金瓊花嶽髙擬嵩華曰嶽宋壽山艮嶽嶺闕元魏羲和景陽山東宋積雪華陽宫嶂闕宋下章谷環石中空曰谷宋藏煙壑滿出以浸曰壑本朝雲龍洞深通似㭘曰洞唐金沙華清宋碧虚迷真襍桃源在望沙樓下岡闕宋芙蓉杭峰闕元魏常娥景陽山西唐玉蘂華清宋飛來神運昭功敷慶萬壽慶雲萬態奇峰本朝叢玉奎章閣前仁壽萬嵗山下巘瘠下肖甑曰巘宋黄楊麓木豐山趾曰麓宋斑竹崖邊山仄隘曰崖宋椒崖磴陟級飛陞曰磴宋朝真坡峻側頗倚曰坡唐金鑾宋龍栢道允蹈安行曰道秦馳道甬道閣道軹道前漢馳道輦道複道唐龍尾九成徑反仄弗裕曰徑襍採香吳石骨峭形乖曰石前漢膚寸六朝三品宋朝日昇龍驤龍啣日坐龍矯首風門玉龍蹲雷門玉竇溜玉排雲堆青噴玉銳雲凝碧藴玉軃雲栖霞望雲雷穴積玉吐月坐獅玉龜留雲月窟啄玉栖霧金鰲玉秀卿雲日觀疉玉栖煙伏犀三秀衡斗萬壽疉翠宿霧怒猊叢秀捫參老松雕琢瑞霧渾成獨秀壽星登封蓬瀛須彌老人翔鱗舞仙本朝丹霞洞天瑞雲銀漢飛星沈潛在囦生生咸若鑑水知清容德乃皭次池之扁第十三池坎止流遲曰池周𤣥池瑶池樂池璧池秦蘭池鎬池前漢鎬池長安西周二十一里滄池未央當路初池麋池蒯池昆池周三百三十二頃元狩三年作神池在昆明中郎池東陂西陂牛首太臺已上十一池並在上林苑太液長安西建章北未央西南周囬十頃闕闕闕琳池元始元年作積草中有珊瑚髙丈二尺一本六柯四百六十條尉佗所獻號烽火樹百子七月七日臨之作于闐樂樂畢以五色縷相羈謂之相連愛鶴池長安西盤池長安西北氷池一名彪池在長安西雁池梁王菟園牟首霍光􅙪鶴承露昆靈中有倒披蓮連錢荇浮根菱天泉上有連樓閣道中有紫宮含利後漢濯龍園中九龍御龍白石天泉四池並在洛陽城中鴻池靈池曹魏靈芝黃初三年作天囦五年作於華林陰泉陰流鳴鶴流柸濛汜七池並在洛蘭渚𤣥武建安元年作淥水瓊華􅂼圃五池並在鄴晉含利都亭靈芝濛汜潛靈五池並在洛六朝天囦一名天泉華蕚元嘉中作於華林園濛汜梁陳龍舟游嬉之所清游明帝為太子時作在西苑一名覆柸池流杯在樂游苑華林昆明即𤣥武湖周四十里太興作善泉昭明太子作于𤣥圃周四百餘歩元魏天淵𤣥武景陽山上流觴三池並在洛陽華林園洗煩昆明碧海鴻雁天泉神泉旋鴻四池並在代北齊金華宇文周昆明隋九洲洛宮城内曲水上林海内池並在洛積翠凝碧九曲廣陵唐九洲仁智殿南九曲凝碧蓬萊龍首魚藻太液定昆昆明興慶臨碧曲江五代獬豸洛陽㑹節園内宋九曲洛金明㑹靈並在汴龍祥汴宮後苑金龍游浮碧本朝太液襍申池昭華並齊清涼慕容氏靈芝龍躍王建靈泉後涼閑豫張駿鑄銅龍於其上淥漣赫連氏玉液南漢甘溪南漢陂停水以防曰陂秦蘭池唐積翠月陂上陽塘匽瀦弗蕩曰塘襍汗塘沼周靈沼曹魏虞淵宋環碧潭唐廣運苑内五代嘉猷洛江夷波弗尨曰江宋景龍海滙源汪濊曰海元魏蒼龍華林東扶桑華林内襍曲光慕容熙湖可注可溉曰湖六朝𤣥武樂游苑河支港復合曰河宋護龍襍紫陌慕容渠居療静陸曰渠元魏流化隋龍鱗上林唐永安清明龍首襍天河慕容熙作溝細流交注曰溝前漢楊溝澗介溪以注曰澗宋躍龍泉涌瀵啟原曰泉前漢聖女即氷池唐醴泉九成丹霞飲鹿二泉並在缺洲重川周遶曰洲前漢鶴洲宋海棠渚遮洲駐流曰渚宋鳬渚菟園湯流温因室曰湯唐宜春九龍少陽蓮花星辰即玉殿五湯並在華林鳳泉岐州舟刳木浮行曰舟前漢龍首鳴鶴容與隋黃龍翔螭浮景㵩彩𤣥武朱鳥蒼螭白虎青龍五樓青鳬凌波襍余皇吳橋跨波梁木曰橋六朝婉轉𤣥圃唐重津端門外橋天津中橋黃道裏橋利渉南北望春青城龍鱗宋玉虹龍祥池上天漢宣德門南汴水上龍津柳浪日華月華襍應聖王建飛虹南唐閘楗流即閉曰閘宋桃花井清潔以汲曰井六朝景陽一名胭脂藏氷樂游元魏八角西游禁扁卷四
