body:
  text: 禁扁卷三元王士㸃撰五下堂堂正向陽曰堂五帝縉雲黄帝周明堂光碧穆天子𤣥堂前漢神明玉堂瑤堂畫堂太子宫朱雀延清即清凉殿後漢承明南宫萬金曹魏翦吳茅茨夷備並在華林鳴鶴魚池晉東堂西堂宣猷堯母長壽則百螽斯休徵延禄承慶仁壽綏福含芳樂昌椒華芳香顯成承光五福嘉寧已上二十堂並在洛昌福虚徳嘉徳九華徽音修成永光並在宫中魏晋疑積弩崇天並在金墉六朝螽斯則百太殿東西閱武宋改徳陽樂賢儀賢一殿中堂一殿聽訟梁改儀賢在宣陽門外崇政東西瑤池畫堂太子宫徳賢樂修集賢貞華並在臺城宣猷𤣥圃竹林芳香琴宋改連理芙蓉並大明作延賢雲堂茅堂連玉醴泉祓禊已上華林正陽宣武一作光武帳並宣武塲内元魏光極宣極清徽西栢四堂並在洛凝閑茅茨並在華林園崇天金墉雲母天興三年作九華始光三年作棗間宣文代太和十二年作皇信代太和七年作含章東魏北齊凉風徳陽晋陽萬嵗乾壽聖壽萬壽隋文綺花光並在洛宫中華清翠阜流芳清風光風崇蘭麗景鮮雲並在洛宫中紫霄玉華延祥碧華瑤華御福祥龍明華雕綺嘉猷芳輝花梁含光温玉繁露重璧儀鸞芳音璧月光華懐芳瑤光東西山齊輝景流珠江都流風𤣥堂開皇十年作唐明堂即洛陽含元殿天堂明堂北洞𤣥上陽華渚翠阜流芳清風光風崇蘭麗景鮮雲並在洛苑中大朝起義晋陽歸鴈宋蕚緑華寰春玉春寶㑹椒芳壽寧資善摛文學士院清净已上在汴新益繹已冷泉香遠清深榮觀玉淵清賞流杯跨水論思獻納省寅清祥扈司農道山秘書羣玉凝香整暇進思遂初竒勲明倫立教汲古𤣥化崇化改敦化又改化原立武改敦閱正紀徳暉明應道犯志敬清風垂福清境大範觀復灌妙通真瀛嶼挹翠攬遠明秀譯經潤文正義雲錦已上在杭遼日月四時天膳本朝芳潤拱宸襍玉路昭寧並新莾螽斯則百李中改愧賢並劉聰琨華宣徳並吕纂湛露劉聰諮議澄𤣥並姚興宣徳閑豫嘉納靖恭已上李暠嘉宴希聲澄心徳慶堂皇臺屋徒在曰皇晉桃間杏間柰間竹間魚梁醴泉百戯水碓擇泉並在洛宫中寢夕宴休憇曰寝周大寢髙寢路寝燕寢小寢内寝舍憩止舍息曰舍前漢増成昭陽椒風屋人居攸主曰屋晉鬱金齋肅齊不齊曰齋六朝八闗隋珠露流風回雪並在洛文猷文徽亭聳檻四植曰亭前漢萬嵗後漢萬壽晉西明六朝永昌吳五馬晋金昌宋臨風梁甘泉甘露並陳曲水蔬圃醴泉並華林園閬風樂㳺苑内散福郊壇光明北湖勞勞即臨滄觀征虜觀稼臨芳清露臨淵景風回賓元魏五石天賜二年作于代臨澗洛陽清暑殿東隋琉璃九州池内迎風回廊並在洛宫芝田流芳洛浦飛香芳林徵秋露華翠阜留春流風芳洲飛華回流長塘並在西苑懸鏡春江澄月並在揚子落花飛花翠葩積翠澄江閬風散芳翠微澄景方玉逍遙圓珠彩霞凝碧紫巖尚陽合璧臨月露華蘭臯含輝唐㑹慶望雲太極放鴨望春韶芳凝思並未央琉璃瑶光殿南集耀神和含蓮芙蓉冝男露菊耀掌九洲並上陽回流流風露華飛香芝田長塘芳洲翠阜芳林流芳飛華留春徵秋洛浦並隋洛在西苑凝碧池内彩霞曲江翠隂華清冝春看花虹霓黒山海池松山流杯並在九成振旅天寶八年作桃園七架精思南北昌國含春含象臨渭永泰青門芳樹金谷真興栁園沉香披頭神臯蠶壇五代含嘉宋涵曦瑤津濯英達觀澄華澄瀑澄桂緑漪疉玉泛羽迎曙偈歌雲英流碧華景垂雲翠芳八角臨漪華渚琳霄碧琅玕晨暉麗則雲巋層巚層巒飛華褰風已上在汴席珍絳華定一俯翠盤松望江雲章方壺含章繹志芳潤延桂浣溪芸香清勝蟠翠雲香綺繡挹露玉蘂虎林丹丘元圃香月寅賔静樂花光清妍清新臨賦燦錦至樂㵼碧已上在杭金雪香瓊香並在杭臨漪本朝徽青碧芳芳碧延華閣玉虹廣寒西南金露廣寒東南方壺金露東南瀛洲玉虹西南襍紅羅翠微望湖延賔並在南唐降真蓬萊丹霞怡神並王衍翠煙從海天居奕奕森羅紫宫以時譽處體寧道崇次房之扁第六房旁室翼拱曰房六朝紫極斯男宣豫綵藝隋承徽流景夾椒房間謐曰夾周西夾序叙别内外曰序周東序西序廂形箱以豁曰廂周東廂西廂前漢西清个介室時居曰个周左个右个軒窗前在廊曰軒宋種玉緑雲玉林玉真汗青勁霜廬次舍交互曰廬前漢承明後漢鳯凰濟陽宮侍中南六朝祕閣直廡廊周四外曰廡後漢百丈廡恭陵元魏步元㳺凱茅茨堂前廊圜外嚴禦曰廊六朝徘徊𤣥圃襍響屧吳墀階上塗地曰墀漢丹墀第二重階上唐龍墀第三重階上宋沙墀第三重階上庭門屛之内曰庭五帝明庭周太庭少庭元魏太華宋著作階升降作階曰階周阼階賔階側階除門屏之間曰除晉椒除垂階下遶外曰垂周東垂西垂芒芒宇縣四達無疆大明周覽日月齊光次樓之扁第七樓牖户孔明曰樓三皇執期五樓十二樓前漢開􅁭井榦在未央髙五十丈正女即鳯凰闕曹魏麗譙落星百丈洛陽西隅三層洛宫中明帝作晉鳯凰伺星翔鳯慶雲並在洛宫儀鳯總章觀内北固射雁六朝鳯凰入漢義熙八年作于石頭凌烟宋落星建業吳大帝作北顧即北固青雲觀稼藉田望遠即勞勞亭穿針即層城觀武帝作朝日夕日光巖殿前並梁武作白雀景雲穿針樓西景陽宋改慶雲麗日興光齊世祖作陽雲明光梁元帝作元魏𤣥武天興四年作崇虚太和二十一年作北齊逍遥披雲鸚鵡鴛鴦萬嵗千秋𤣥武宇文周雲和隋朝日明月並在洛宫垂雲照日鳯凰迷樓唐五鳯即應天門廣達在洛陽宫浴日上陽宫梳洗九成春明晨暉長安夾城内門觀風瑤光丹霄已上三樓並在華清絳霄百尺凉飊承日𤣥康走馬龍尾宣制宣御已上九樓並在九成順天即承天門明義華蕚相輝勤政務本神武制勝即𤣥武門明光已上四樓並在興慶紫雲芙蓉園叡武籌邉嚴武興慶金明丹鳯廣運萬嵗春望興安長慶却敵延喜長樂𤣥英安福親親在十六宅鬱儀三殿東廊結鄰三殿西廊拾翠大福殿東北五代𤣥武咸安唐明徳宋日樓月樓紫雲五鳯並在洛寶津瓊林苑丹鳯即明徳門太清屬籍昇平皇儀殿後西向北極絳霄端拱興國五年作並在汴薫風河中府蘂簡玉籟日華月華聚遠徳壽宫鳯山冲天錦繡和應凝真並在杭重熙頒慶南京升中延福告成均慶駐蹕宣恩河中回鑾慶賜鄭州霈惠澤民汾陽回鑾覃慶衮州奉元均慶亳州已上八樓並真宗因廵幸所過作遼五花五鳯迎月南京金嘉福嘉瑞丹鳯瑞雲瑞光本朝凝暉興聖東廟延灝西廂驂龍翥鳯西廂襍飛越凌霄天興溥儀鳯劉龔百尺南唐齊雲南紀望沙季興丹霞金碧閣庋置尊居曰閣五帝阿閣扈閣並黄帝秦凌雲二世前漢延閣堯閣阿閣開􅁭曝衣崇芳含章朱鳥龍興屬車宣室玉堂曾盤麒麟武帝獲麟作此閣天禄石渠已上六閣在未央後漢阿閣藏書晉清陽白藏飛雲金光安樂章徳明慶承休崇明文成朱明顯仁安世長安已上十四閣並在洛祕閣東門西華紫閣六朝昭徳武徳重雲望仙結綺臨春三閣並陳叔寶作麗椒飛香承香招賢清曜華林元魏虹霓蓬萊山上麟趾宇文周重雲武成二年作隋巢鸞㳺麟同心登春飛綺彭城慶雲祕書已上三閣並在東都唐同心武成殿北臨波䴡日臺北登春飛綺並在臨波後池内閶闔映日臺東隔城之上七寶上陽昭慈已上七閣並在東都紫雲功臣凝隂翔鳯凝暉凌煙已上六閣並在太極景雲麟徳殿側承雲修文翔鸞含元左樓鳯含元右清暉鬱儀結鄰上閣並在大明祕書儀鳯延春降聖改朝元冲明清照延英宣光乗雲瑞閣啟聖宫宋降真改宗真在廣聖宫大寧改翔鸞㑹春改儀鳯感真真㳺殿改圓象徽猷曼春延春即萬春邇英並在大内疉瓊芬芳麗玉寒香拂雲偃葢翠葆鈆英雲錦蘭薫摘金已上十一閣延福東繁英披芳雪香鈆華瓊華文綺絳葩穠華緑搖碧清音秋香叢玉扶玉絳雪已上十五閣延福西明春髙十一丈宴春髙十二丈薫馥報瓊蟠桃春錦已上二閣在丹延妙有宣道稽古邃古尚古鑑古作古訪古博古祕古延義太真翹翠燕處玉華經武樞武紫微後省求賢太子御書凌虚寶符昭應宫屬籍宗正已上並在小闕保寧聖后神御望仙清華清寧首善太學御書昭徳崇勲太常風雲慶㑹􅅷功已上在杭龍圖太子御書寶憲經典明載史傳博文子集昊華天文彰繪圖畫時徵瑞物已上六閣並因闕寶文即壽昌仁宗顯謨即熙明神宗徽猷哲宗敷文徽宗煥章髙宗華文孝宗寶謨光宗寶章寧宗顯文理宗已上並藏御書遼乾文金芳華景福燕昌光昭清微翠微蓬萊瓊華本朝延春大内後宫正殿徽儀興聖殿後延華徽儀北奎章宣則門北大安統天二閣上京萬安和寧襍扶天龍飛壽光並王建綺霞天泉涵虚並南唐飛鸞勤政繼思西恩明霞安南品物流形天黙以成豫春㳺秋履危兢兢次臺之扁第八臺堅崇超特曰臺三皇傳教燧人氏昊英氏青靈九成明臺三臺並黄帝管子云黄帝立明臺之議樂臺五帝靈臺堯夏清臺鈞臺春秋傳璿臺啟享神之所商神臺即清臺之義南單鹿臺周靈臺即神臺義以覩天文時臺以觀四時施代囿臺以觀鳥獸昆臺昭臺誃臺景王作重璧穆天子傳秦琅邪章臺鳯凰望漢前漢蘭臺武臺果臺曲臺月景已上未央鬭鷄走狗已上犬臺著室臨華酒池已上長樂栢梁元鼎二年作香聞數十里臺髙廿丈鈎弋並未央東山西山壇臺射臺並長樂神明建章望仙一名通天一名候神髙百餘丈通靈瑤臺已上並在甘泉望鵠眺蟾並在影娥池上凉風建章宫北積木為樓漸臺避風並在太液池上桂臺商臺並在琳池上龍臺靈臺即清臺郎臺叢臺露臺尋真招仙甘泉騰光即經星建元二年作符節登仙昆明池上歌風顥天歸來望思陽雲承光日影八風謁者繁臺一名吹臺平臺二臺梁孝三年作思仙淮南王安銀臺平子賦後漢雲臺髙閣十四間蘭臺並在南宫魚梁清凉温明臨照憲臺尚書謁者候臺永安宫章臺曹魏銅雀建安十五年作臺髙十丈有屋一百一間金虎十八年作臺髙八丈有屋一百九間冰井臺髙八丈有屋一百四十三間上有氷室室有數井井深十五丈藏氷及石墨又有粟窖及鹽窖已上三臺並在鄴城之西北固城為臺閣道相連凌雲黄初二年作于金墉臺髙廿二丈登之見孟津建章文帝時為太子作永始華林南廵黄初五年作于宛東廵六年作九華七年作于天泉池金鳯鬬鷄丹書蘭臺晉鬭鷄射雉並在廣陽門西南崇文凌雲明光殿西髙八丈四臺並在洛思子織室蘭臺六朝一柱宋元嘉中作景陽日觀大明中作並華林園望宫九日商飊館通天臺城内望耕落星吳朱雀齊凌敲宋武作太平州北黄山上以凌敲敲暑謁者蘭臺雨華梁武帝作鳯凰元魏陵雲舊臺靈芝釣臺並在西㳺九華缺巵清暑殿西並在華林鹿苑天興二年作于代閱武隂山缺章北齊金鳯即銅雀崇光即氷井靈應即金虎偃武修文並後主作應聖隋妙楷藏法書寶跡藏名畫並在觀文殿後仰觀閶闔門内月輪並在洛官集靈上林海内建章麗日麗春雲光謁者司宫釣魚都梁唐文昌肅政望仙測景河南府陽城縣神鵲硖石縣東天寶二年因赤雀見作銀臺集靈即長生殿粉梅撃鼓按歌四臺並在華清麗青景福太極麗春仰觀大明宫講武麟臺蘭臺鸞臺謁者宋璇璣渾儀觀耕雍熙四年作于藉田講武本漢梁孝王吹臺欽天汴宫中宴春髙宗作八仙建康遼九層天顯五年幸本朝司天御史襍九成有娥氏觀臺泉臺施惠晋靈臺衛檀臺齊章華新臺陽雲昆昭强臺景夷匏居已上七臺並楚洪波叢臺並楚崇霞寧臺並燕姑蘇吳望氣韓遄臺栢寢並齊昭臺中天並魏文臺越凌霄劉曜靈鈞張茂玉女李軌波若姚興觀雀石虎三清王昶靈霄凉馬閱馬仰觀並疑石屏南漢榭崇屋欹前曰榭周宣榭前漢長楊後漢髙光壇重成坦明曰壇周方明前漢拜將汜陽後漢髙邑六朝方明受禪隋通真玉真景運門右闕受命五龍興慶受瑞晋陽倉城遼金鈴神册元年受尊號于此禁扁卷三
