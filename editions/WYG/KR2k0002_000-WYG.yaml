body:
  text: 禁扁地理𩔖一宮殿簿之屬提要臣等謹案禁扁五卷元王士㸃撰士㸃字繼志東平人是書凡為目百一十有六篇一十有五釐為甲乙丙丁戊五卷何晏景福殿賦云爰有禁楄勒分翼張注引説文扁從户冊者署門户也扁與楄同此書詳載歴代宫殿門觀池館苑籞等名故取義於此卷首有歐陽元至順元年序虞集至順癸酉序皆以詳贍推之其中如釋東西箱以西清附之葢本前漢司馬相如傳注謂西清即西箱也而其釋東西序則與東西箱别為一𩔖不知景福殿賦西箱踟蹰以開宴東序重深而秘奥西箱西序也東序東箱也本屬互文而析為兩地則於宫室之制殊未能詳考又如釋秦雲陽宫一名林光一名甘泉考程大昌雍録漢之甘泉在渭北之雲陽秦之甘泉在渭南之鄠縣謂秦甘泉一名雲陽殊誤又孟康郊祀志注漢甘泉一名林光師古謂漢於秦林光宫旁别起甘泉宫謂之漢甘泉一名林光亦非則於地理學亦不免偶疎至於秦祈年宫三輔黄圖以為穆公作此書獨本漢書及水經注之説以為作於惠公似非無見又若曲臺宫之𩔖兼採雍録以補黄圖之所遺頗可藉以參考末附名釋一篇訓詁亦極典核雖時有疎密要於史學不為無補矣乾隆四十六年十二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀禁扁序禁扁一書通事舍人須句王君繼志之所作也繼志蚤弃舉業慨然有志著述而職在九賔嘗撰侍儀儀注若干卷送上官其餘力又蒐考厯代宫殿門觀池館苑籞等名輯為是編豈特示該洽而已哉為人君者得是書因名號之文質思制度之奢儉又有以觀後世禨祥避忌之習務擇令美滋不如古人之仍事實存鑒戒之意矣為人臣者得是書其在朝廷設顧問則可以無召對寡陋之虞退而閒居偶有題榜則可以無重複嫌疑之犯其所以資見聞明等威亦豈小補哉近世傳者愽古自臨江劉氏番昜洪氏没無聞宋末西蜀虞氏栢心四明王氏厚齋猶能儗之繼志年學方富嗣此其有作也余故甚嘉嘆之而為之序至順元年九月初吉廬陵歐陽𤣥序禁扁序繼志故翰林學士承百中書叅議魯國王文康公之次子也世祖皇帝旣取宋淮南忠武王還奏留董忠獻公鎮綏江南時文康公以翰林應奉文字使董公軍中因謂董公曰宋氏經史圖籍文書畧備不及今上送朝廷懼將散軼不可復得關係甚重也董公竒其言悉録中祕外府圖書連舸致之京師而屬文康公䕶之今館閣所藏多當時故物有識者甚韙二公所為也於後文康公掦厯臺省賔客門人一時文學之選皆在是以繼志兄弟見聞異於常人又以彊記博學稱於時自紈綺之習固無與斯事而寒雋視之更興寡陋之歎矣禁扁之書在史館暇日所編號為詳贍而他著述尚多也繼志年富力彊好親師友則所學又當不止如著此書者至順癸酉三月二十九日雍虞集伯生甫書
