  text: 欽定四庫全書禁扁卷一
  hash: sha256:e2a915bdc1145e868fb0dae2d884c235abc232b9553acba1cdddab377ab448f2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2k0002_WYG_001-1a, image: WYG0468/WYG0468-0039c.png}
body:
  text: 元王士㸃撰神廷淵黙不華而尊錫名孔嘉目諟思存次宫之扁第一宫三皇合宫黄帝出尸子管子文中子璇宫少昊母皇娥居五帝法宫漢晁錯傳撝宫堯出嚴助相貎經貳宫堯商鑣宫墨子桐宫周西宫東宫内宫北宫后之六宫車宫會同時掌舍設之蒿宫以瑞蒿為柱酆宫文王作昭宫范宫並穆天子傳鄭宫春宫祗宫並穆王紀年郊宫郊特牲射宫一作澤宫禮記射義宗宫玤宫虢公作踐土晋文公作禖宫秦西垂文公作平陽封宮武公伐彭戯氏至華山下居之橐泉武公作在扶風祁年恵公作在岐州城西棫陽昭王作在右扶風羽陽武王作于陳倉梁山好畤長作朝宫可受萬人三十五年營於林苑中立金人於宮門曲臺已上四宫並始皇作號宫宣太后作步高亦名市丘城鐘宫鄠東北二十五里阿房一名阿城惠文王作始皇廣之三百餘里閣道通驪山八十里望夷胡亥齋所步壽新豐縣步髙西萯陽鄠西南惠文王作雲陽一名林光一名甘泉二世作從廣各五里曲梁三原黄白城内咸陽即信宫始皇十七年作興樂一名長樂長陽盩厔東南三十里昭王作逃夏城陽髙泉霸宫曲陽章臺前漢未央一名紫微一名東宫周廿二里九十五步在長安縣西北十里髙帝七年因龍首山作前殿北闕王莾改為壽成室建章武帝太初元年作周三十里天梁枍栺駘蕩馺娑四宫並在建章宫中三良近回中平陽甘泉秦宮一名明廷在池陽西去長安三百里因郊祀置太一祠周四十九里武帝作長定許后廢處竹宫二宫並在甘泉宫中髙光通天迎風三宫並因甘泉宫置神光羽獵賦長樂秦宫在長安縣改城中一名西宫髙帝五年作周二十里改永樂王莾改為常樂室長秋長信二宫並在長樂宫中長平長門在長安東本竇太主園獻為宫長楊盩厔櫟陽馮翊陵陽咸陽徳陽景帝廟池陽去長安五十里涇陽西北八里資陽萯陽鄠陽西南二十五里首陽望遠長安望仙元封三年作七里鼔簧在建章宫西北周二百四十步包陽長安西神仙五柞步髙秦宫陽靈祠神所蒲萄上林苑西元壽三年單于來朝舍于此昭臺上林苑中黄山與平縣西三十里澇入渭水之下惠帝作扶荔在上林中元鼎六年破南越後作植所得竒草異木二千餘本鼎湖藍田四寳未央北即桂宫棠黎甘泉苑南二十里延壽長安栢梁鈎弋因昭帝母趙后作永安思子湖之渭南明光太初四年作宣防即龍淵元光三年河决瓠子塞决築宫其旁萬嵗汾隂武帝作集靈華隂武帝作冝春谷口太一祁年修池承光曾城回中在安定文帝四年胡燒之南宫一在洛一在魯集仙華陽武帝作宣曲昆明池西宣帝曽度曲于此蘭池渭城儲元長安城西沛宫長壽永信太后居中安皇后居三雍步壽神爵三年鳯凰集祋祤縣東北三里得玉殿首山上郡元封六年作犬臺長安西二十八里髙皇長安長安北宫近桂宫周四十里髙帝作武帝増修前殿廣五十步竒寳在建章宫壽宫弩法洪厓師徳一作師得夜光長安交門不其咸宜魚藻即趙王如意養徳宫章臺江都易王建作日華河間獻王徳作曜華梁孝王作萬載燕剌王作後漢南宫帝為東宫后為西宫北宫明帝作去南宫七里長樂永安洛陽故城中周六百五十九丈池陽涇南原眭城南永樂徳陽前殿西北八門長秋在南宫胡桃承光二宫並在廣陽門外徳陽東平邯鄲長信濯龍即濯龍園近北宫缺宫桐宮大駕函谷濟陽光武生所懐宫河内建武元年祠太祖太宗于此曹魏永壽卞后居永寧洛明元郭后居永安大徳郭后居許昌長秋蜀永安䕫縣西晉永昌即金鏞城趙王倫以居惠帝之所𢎞訓景后居璇華王井永樂永寧崇化武帝立太后居六朝太初赤烏十年作即長沙王故府方三百丈安定亮妻朱氏居升平皓母何氏居昭明太初東寳鼎元年作周回五百丈改顙明又曰清溪武昌已下三宫並孫呉作顯陽即臺城咸和七年治新宫大元三年謝安又作新宫洪訓羊太后居崇訓簡文之母李太后居崇悳康帝之后居崇化王太后居永安臺城東華門外太元二十一年作以居穆帝之何后𢎞化已上五宫並東晋作親蠶大明三年立于西郊明堂大明五年作于丙已之地東宫即晋永安元嘉十五年改𢎞訓武悼楊后祠所長樂石頭未央東府建章北邸長楊南第四宫並子業作丹徒武帝濳宫永樂崇憲永訓已上十二宫並宋作宣徳太后居青溪武帝濳邸已上二宫並南齊作安徳金華大同中作在青溪東去臺城三里江夏樂修樂安已上五宫並梁作𢎞範慈訓安徳文皇后居樂安已上四宫並陳作元魏大夏閶闔洛城金墉盛樂代萬壽代東宫承華代神䴥四年作廣徳代壽安代皇興五年作崇光代延興三年改寧光永樂代太和十六年作崇訓靈太后居阿房温泉顯陽永安豺山天賜二年作繁畤天興二年作西苑泰常三年作白登蓬臺並泰常四年作灅南泰常五年作新城大延元年作河南黄山瓜步太武作静輪真君三年因冦謙之作髙齊金虎静徳文襄后居聖應光崇宣訓三臺昭信文宣后居順成孝昭后居邯鄲武平七年作大明天統間作清陽見歸彦博宇文周長春武帝作于同州朝邑正陽長安天興大象三年作雲陽長安天城同州咸陽𢎞聖楊太后居崇聖孝閔后居隋紫微青城至寳城七里景華建國西南十二里冷泉有泉極冷凌波明徳朝陽總仙海中山上積翠一名翠微棲雲已上九宫並在洛苑甘泉太平宫西南二十里仙經仙都仁壽岐山開皇十三年作天經松仙疑即總仙顯仁一名藻澗大業元年作于洛陽壽安縣仙林文帝作于興平縣西十八里離光離英流英紫芝凝華揺景浮彩舒芳懿樂彩璧淑風清暑朱明翼仙層城千金長春宇文舊宫臨江揚州汾陽大業年作臨朔涿郡福昌福昌西十里六昌谷之東大業三年作臨渝崇業去渭南東十五里大業三年作永安太平鄠縣東南三十里𢎞聖隴川大業六年作丹陽普徳華州鄭縣長樂亭子洛陽上春門東金城普徳東興徳馮翊南冥壽文山鳯凰三宫並盩厔顯陽江都敷水改華陽又改瑶華醴泉仙㳺盩厔南三十五里阜澗一名甘泉北通洛苑江都楊子二宫並在江陽歸鴈回流九里松林楓林大䨓小䨓春草九華光汾已上十宫並在江都都梁盱眙東十五里煬帝事㳺幸自雍至揚離宫四十二所都梁其一也其中宫殿三重洪農毗陵大業十二年作周圍十二里内有十六離宫唐太極西京西内大明西京東内即永安龍朔二年作後改蓬莱興慶西京南内𤣥宗舊第大安即𢎞義武徳五年作貞觀二年改通義長安髙祖舊第武徳六年作宫永安在麟徳貞觀八年作龍躍京兆武功西四十里奉義監髙祖舊宅武徳六年作翠微宫即太和在長安太和武徳八年作貞觀二十一年改慶善京兆武功南十八里臨渭水髙祖舊宅太宗生所武徳元年作武功官六年改玉華貞觀二十一年作仁智武徳七年作二宫並在冝君九成一名萬年即隋仁夀九曲西京禁苑奉天嵩南永淳元年作三陽嵩陽大歴三年作興泰壽安縣西南四十里萬安山上長安元年以三陽宫林作周回四里華清在驪山下貞觀十八年營名湯泉咸亨二年易名温泉天寳六年始改今名飛仙一作飛山貞觀十二年作魚藻大明宫北萬泉一作萬全在藍田永淳元年作紫桂澠池西儀鳯四年作永淳元年改昔桂𢎞道元年廢髙山西苑北飛龍在上黨𤣥宗故第開元十一年作後改啟聖望賢咸陽咸宜漢故宫在西京禁苑冷泉隋故宫景華望春一在萬年縣開元二十六年修一在芳華苑東南隅宿羽合璧苑中之西顯慶三年作初名八闗朝陽龍鱗苑之中央太宗作黄女合璧之東黄女灣三面臨洛水明徳即隋顯仁合璧東南青城宿羽西積翠一名翠微栖雲凌波已上十四宫並在芳華苑内上陽西上陽二宫並在芳華苑東洛水西南上元中青女芳樹長春隋故宫積慶郭太后自興慶移居連昌河南之壽安縣西二十九里東西二百步南北四百步綺岫河南之永寧縣西五里周三百步諸宫皆列槐栢此宫惟有櫟林蘭峯永寧西三十三里長樂繡嶺陜州已上四宫並顯慶三年作開元二十七年修晉陽天授元年作靈武天寳末肅宗作桃源靈寳縣武徳元年作甘泉已下三宫並漢故宫未央通天則天長壽改乾元為明堂因號曰萬象神宫證聖明堂火更造又號曰通天宫興徳馮翊南卅二里髙祖起兵决忠武園因置亭作宫陜城陜縣金城隋宫武徳三年廢顯慶三年復神臺隋普徳咸亨二年改蘭昌隋福昌在福昌西十七里顯慶二年復開元二十七年修因改今名周五百二十八步華隂隋瑶岳顯慶三年改崇業隋故宫在龍㳺東十五里迎仙龍㳺渭南西十一里開元二十五年作昇仙天寳二年作太初即洛陽宫武后改尋復舊太微東都道宫太清即西都混元道宫汾陽銀潢文苑英華有魏元忠侍宴銀潢宫詞一首含元龍池河中安邑縣開元八年作天華襄城汝州西山貞觀十四年作紫極昭仁𤣥沼西京禁苑内昭徳近昭逺門光啓龍山池咸通六年作蘭池髙祖餞太宗于此静安髙祖别廟崇聖太宗别廟在長安崇徳坊下積善五代建昌梁宣武治所因為宫至徳唐興聖唐鄴宫長壽唐太微唐大明大寧晋以建昌改長春唐荘宗母宮冷泉二宫並在洛大昌積慶廣徳興義慶昌太平昇平宋萬安即㳺福殿咸平二年改建明徳后居祥符二年復改為殿景祐二年改寳慶宫章惠楊后居四年改慈徳殿慈壽治平元年作以居太后慶壽福寧殿東曹后居寳慈福寧殿西宣仁后居二宫並熙寧元年作崇慶宣仁后居隆祐二宫並元祐元年改建此宫以居昭慈后紹聖元年改慈徳二年改聖瑞欽成后居崇恩昭懐后居寧徳顯肅鄭后居興慶在東華門西北之南廊後改慶寜睿成神宗所居東宫元祐元年作龍徳元符三年以懿親宅濳邸為之長寧延福北景祐二年作後改廣聖徳成東華門内瑤華延福西華門内濳龍真宗為開封尹潛邸元符九成徽宗作以安九鼎集慶和陽景靈宣徳門外以神奉御華陽徽宗作秦邸寳鼎縣應天啟運寧安玉清昭應葆貞已上在汴太一徳壽即秦檜故宅紹興三十二年作髙宗内禪即自居之孝宗内禪改重華孝宗崩二太后居之改慈福謝后居改壽慈泰安即福寧殿光宗改又改壽康慈寧建延九年作以居韋后萬壽開元龍朔宗陽已上在杭會聖河南永安以奉神御廣福崇福登封真宗神御遼日月温泉會同元年幸洪義國語蘇斡延鄂爾多太祖作永興國語彀烏寧鄂爾多武帝作積慶伊囉斡鄂爾多和帝作延昌岱拉哈鄂爾多宣帝作章敏嘉們鄂爾多熙帝作長寧富僧額鄂爾多安帝作崇徳沽依鄂爾多成帝作興聖孟古鄂爾多成帝作敦睦學順徳哩本鄂爾多文帝作永昌阿掄鄂爾多豫王作延慶阿郭鄂爾多章帝作長春聖宗御太和延和述律太后龍眉即臨潢興平金啟慶衍慶聖壽翠微慶寧景明坤寧光春萬寧磐寧壽康仁壽隆慶壽安長春建春興徳慶元光與孝寧壽聖集慶坤儀㑹聖本朝慶福興缺􅇎楚宫泉宫閟宫司鐸並魯北宫大宫虒祁銅鞮並晋雪宫梧宮並齊碣石昭王為騶衍作元英磨室並燕蘭宫渚宫章華汝南城父虞懐並楚西宫沃宫並宋上宫滕鴻臺韓館娃吳信宫沙丘並趙長樂未央並劉曜崇訓改太子宫為之澧水二宫並石勒建章徽音二宫並苻堅永訓駿妻嚴氏居永壽駿妻馬氏居酒泉三宫並前凉龍和紫陌逍遥熙作三宫並慕容氏長安永安二宫並姚春明光冉閔去鄴三十里金城竇建徳丹陽楊􅄎永寧􅄎為讓皇時居顯聖北漢碧湘馬殷太平周行逢竇皇大明長春紫微東華躍龍已上六宫並王閩崇徳廣陵舊第徳昌内帑别藏積慶改崇道三宫並南唐龍興清和金華永康迎仙昭聖天啟水晶已上八宫並前蜀昌華天明甘泉玩華秀華玉清太微七宫並劉