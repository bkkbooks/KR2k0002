  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2k0002_WYG_005-1a, image: WYG0468/WYG0468-0109c.png}
body:
  text: 禁扁卷五元王士㸃撰明明象魏逹聽四方五禁閽寺維門是防次門之扁第十四門四闢廣聞曰門周臯門圉門王城南門鼎門東門乾祭北門庫門雉門應門一名朝門路門一名畢門一名寢門一名南門一名虎門法門皇門一名閎門和門帷宫以旌為之轅門車宫以兩乗車為之棘門壇壝以㦸為之人門以長人表門秦磁石即却敵前漢鼎路南一曰安門王莽簒位十二門皆改之此改曰光禮覆盎南之東一名杜門一名端門改永清北直長安西安南之西一名平門一名使門改信平北直未央宮清明東一籍舊一名凱門改宣德青綺東之南一名霸城改仁壽宣平東之北改春玉直城西一名龍樓改直道光畢西之南一名章城改萬秋亟里西之北一名雍門改章義洛城北一名朝門一名髙門一名廣門一名㕑門改建子光門北之西改朔都臨利北之東一名杜門一名洛門一名利門改進和已上並長安城門止車閶闔正亦名壁門司馬三門並建章宮作室一作宮龍樓延壽堯母却胡金馬壽成青𤨏禮城中龍華銅龍建禮明光宮後漢平城南一作平門開陽南之東宣陽南之西一作小苑一作誃門津陽宣陽西一作津門一作津城中東東宣平東之南一作税門一作望門上東東之北雍城西一作雍門廣陽西之南上西西之北榖城北之東一作穀門夏城北之西一作夏門已上並洛陽城門司馬宮垣之内兵衛所在皆有司馬主武事故號曰司馬掖門内至殿省為殿門外出大道為掖門南端却非銅龍門上有三銅柱柱有三龍章臺崇德殿前樂成中敬法含章嘉德盛德㑹福威興宜秋承明金馬鴻都登賢青瑣春興已上二十門並在南宮止車闕外有東西南三門司馬南掖北掖東掖西掖虎賁掖端門正雲龍神虎西東明廣義崇賢雲龍内建禮崇賢内朔平金商神虎内德陽鐵柱盛饌含德章臺已上二十一門在北宮景福飛閶闔長秋定鼎金華萬春不老神仙西華金牙千秋泰夏丙舎明禮笙鏞永巷廣懷已上並見河南志永樂金音望鍾盛化金鎬長壽原陵白虎銅龍閶闔飛龍濯龍神龍東華廣德景陽明福永夏奉春光夏蜀武義虎威曹魏平城開陽宣陽津陽中東宣平上西雍城廣陽上東榖城大夏十二門並闕司馬承明後宮出入之所雲龍明帝作肅成四門並在洛宮鳳陽正中陽中廣陽建春建陽次廣德北廐門次金光西一名白門已上並鄴城門宜陽長春顯陽含春金明宣明崇禮神龍止車朱華乾光順德升賢聽政晉平昌開陽宣陽建陽即津陽東陽清明即宣平建春即上東西明即雍城廣陽閶闔即上西廣莫即榖城大夏已上在都清陽風虎崇禮朱明神獸萬春長春雲龍八門並在洛宮承華太子宮千秋平君小苑南門飛廣德明禮望鍾神仙已上並在洛承明六朝臨硎彎碕二門並在昭明宮公車正昇賢左左掖次左朝陽右掖次右蒼龍東白虎𤣥武北並在太初宮宣陽南一名石門開陽廣陽右即凌陽清明次左東陽建春東之北陳改建陽閶闔西之南後改南掖一名天門西明西之北大夏北之西𤣥武北之次東齊改宣平廣莫𤣥武東即晉平昌陳改北犍延熹廣莫東並第一重門大司馬宣陽内一名章門一名闕門南掖開揚内東掖清明内西掖廣陽内東華東西華西大通北之西梁門承明北之東並第一重門衙門南之西應門南之東神虎西一名神武神獸雲龍鸞飭北之西鳳莊北之東並第三重門太陽即晉端門宋改南中華萬秋西已上並第四重門北二門即鳳莊鸞飭也朱雀望國萬春光德已上三十二門並在臺城南陽温德安陽内承華南則天西已上四門並在東宮南陽望賢徽明青陽崇賢年華延明敬親衆妙元魏平昌開陽宣陽建陽東陽清陽即清明建春西陽即西明西明即廣陽閶闔承明閶闔北孝文作廣莫大夏已上並在洛城門止車司馬端門朱華乾明雲龍神虎千秋東掖西掖並在洛宮乾光含春光極正並在金墉鳳陽望春長夏仁壽招德啓夏陽武納義厚載上秋朱明思賢二門並在代北齊長夏五龍朱華望春厚載仁壽進賢啓夏雲龍朱明上秋納義鳳陽招德宇文周露門應門津門肅章青城隋則天南興敎南之東泰和次東光政南之西永康興敎東折向北東出隆慶光政西折向北西出重光東寶成西𤣥武北曜儀又北圓璧又北方諸圓璧西已上並在宮城永泰則天北東華西華二橫門乾陽永泰北相去四十歩大業乾陽殿北三十歩㑹昌興敎北永泰東章善㑹昌北重潤章善北橫街東景運光政北永泰西顯福景運北閶闔寶城門東百三十歩文成東華東北道右延福西華南四十歩出門西百歩至顯福門街左延福東華南四十歩出門東百歩至章善門街武安西華西道北千福德陽已上並紫微城諸門端門正南左右掖東太陽東西太陽西之北麗景西之南並太微諸門承福南宣仁東德猷西含嘉北已上東城門嘉豫東之北一望春二清夏南之東三興安四昭仁五迎秋西之南六游義九籠煙八靈溪九風和十朝陽北之西十一靈圃十二𤣥圃十三禦冬十四膺福十五並在㑹通苑建國南長夏左白虎右建春東永通右上春左章信西之北立德西之南徽安北之西已上並洛陽城門已上六十五門並在東京安喜北之東明德其北直朱雀啓夏安化通化春明延興開逺金光延平光化安上朱雀南直明德北直廣陽含光景風延喜順義安福廣陽改昭陽長樂廣運重明永春永安建春通明嘉猷𤣥武安禮𤣥德已上並西京宮城門大興改乾福左右延開永福並西京宮中至静至德羲和宣和昇德景陽宣道花光嘉蘭龍光欽明嘉寧顯陽明福䖍化和春明華䖍福和義乾元進食榮光隆業進馬正義西明定鼎金虎春華建陽通善東明曲儀安寧臨華花梁麗日芳音凌康成象芳輝交泰温玉雕綺咸安儀鸞厚載修文璧月輝景文綺繁露莊敬興泰淥波光福觀文禦寒光華懷風永巷重璧懷芳山齊蒼龍唐定鼎即隋建國北直皇城之端門又北宮城之應天門長夏南之東其北直徽安原載南之西建春東永通東之南其西直立德上東東之北即隋上春其西直東域之宣仁門章信西之北其東直建春立德西之南其西之北即賔耀麗景嘉豫諸門也徽安北之西安喜北之東已上並東京都城門端門正南左掖右掖宣耀東即東太陽改東明麗景西之南賔耀西之北即西太陽改西明尋復已上六門並皇城門應天南即隋則天改應天又改神龍又改乾化興敎即重明南之東宣政即永泰重光東宮正門在宣政東賔善重光東小門延義即含清重光西小門大和重光東光政南之西又改長樂隆慶改崇慶洛城南光政西乾村門重光北東嘉豫即寶域洛城西西之南並洛城安寧北之東𤣥武北之西並武城門圓璧南𤣥武北即隋之曜儀曜儀東西顯慶中開並曜儀城龍光北圓璧東並圓璧城已上二十門並東京宮城四隔城宣仁東承福南皇城左掖門之東含嘉東城倉門南門德猷倉城北門四門東城乾元即永泰武后改通天萬春東即萬壽千秋西日華月華乾元外橫門即隋東西華唐改左右延福及改今名㑹昌興敎北章善即延和㑹昌北廣運光政内明福即顯福宣化即延喜光範即敷政唐末改應天承明含元殿西千福武成迎仙集仙殿前歸義仁智殿南春暉乾元左秋景乾元右燭龍乾元北崇賢明福北延慶德昌殿南出韶暉延慶南觀禮收成光慶瓔珞左右銀臺含章金鑾已上三十門並在東京宮城内禔象東之南星躔東之北觀風禔象内芳芳宜男亭仙洛南通仙仙洛西玉京甘湯院東北金闕玉京内奉初金闕南已上並上陽含桃西仙桃玉京西北出壽昌仙桃西𤣥武壽昌北金華已上並西上陽由儀咸安並皇城西外院門嘉豫北之東一上陽二新開三望春四興善即清夏南之東五興安六靈光七即昭仁迎秋西之南八游義九籠煙十靈溪十一風和十二朝陽北之西十三靈圃十四𤣥圃十五禦冬十六膺福北之東十七已上並芳華苑已上百二門並在東京仙游奉天明德正南啓夏南之東進芳東南隅安化南之西春明東通化東之北改逹禮延興東之南金光西開逺西之北延平西之南芳林北皇城西第一街光化北之西並西京都城朱雀南直明德北直承天安上南之東改光天含光南之西景風東之南延喜東之北其東直通化順義西之南安福西之北其西直開逺已上七門並皇城門承天即隋昭陽又改順天長樂左廣運次左重明次左東宮正門永春次左永安右通訓東改鳳凰通明西之南嘉猷西之北𤣥武北安禮北之東𤣥德次東東宮北門已上十二門並東京宮城嘉德承天内歸仁嘉德外之東廊納義嘉德外之西廊恭禮嘉德東其外直長樂興仁嘉德西其外直廣運太極嘉德之北即乾福左右延明太極外之東西廊即隋延興朱明太極殿北肅章朱明右其外直興仁乾化朱明左其外直恭禮暉政次右武德次左兩儀朱明北獻春左宜秋右百福次右承慶次右立政次左大吉次左甘露兩儀殿北日華甘露門外東出丹華甘露門外西出神龍甘露左安仁右宣猷崇道昭德正禮惠訓宣光通福光昭華光暉儀壽安綏福肅政已上並在太極宮中金液太極嘉裕正外直重明永福嘉裕外之東西廊左奉化即依仁嘉裕左右奉化即奉義嘉裕右嘉善顯德殿之東西廊宜春融秋一名宜秋𢎞敎改崇敎嘉福改宣明𢎞禮改重光並太極東宮丹鳳正改鳴鳳望仙左延政次左建福右興安次右其南直啓夏門太和東日營西𤣥武已上並大明宮城通乾龍尾道東觀象龍尾道西宣政含光殿後齊德宣政東廊齊禮一作興禮一作興德宣政西廊日華宣政殿前東廊月華宣政殿前西廊光順昭慶光順南光範昭慶門南含元殿西崇明含耀崇明南昭訓含耀門南含元殿西紫宸宣政殿北延英含殿殿北金鑾宣化左銀臺東入苑直太和右銀臺西入院直日營翰林九仙翰林北銀漢𤣥武門左掖旻霄𤣥武門右掖乾符已上並在大明宮中通陽正南興慶東躍龍北芳苑北之東麗苑北之西瀛洲交泰殿前大同勤政樓北金明大同門西仙雲明義通陽東睿武明光宜天同光承雲初陽飛軒玉華已上並興慶宮𤣥化景耀南芳林南之東即都城門光化南之西即都城門光泰東之南照逺東之北延秋西之南𤣥武西之北啓運北面飲馬北之東永泰北之西已上並禁苑重𤣥北直啓運東西雲龍重𤣥南之東西門日營月營二門在東西雲龍外魚粮重𤣥北並内苑門應乾思𤣥延嘉景運四門見長安志已上百五十一門並見西京宮苑朝陽南開陽東望京西津陽北並在華清宮中雲霞正金華儲並在翠微宮中南風正嘉禮儲並在玉華宮尋真仙遊並奉天左右納善東西永光大猷丹霄涼風望京金獸髙頭瑞景並在九成宮景福興福䖍福白獸貞興開元𤣥英安仙章武望冬景暉凌霄五代左右銀臺梁即章善應順後唐改永曜太平改萬春通政改廣政鳳鳴改韶和萬歳改中興昇龍建國朱鳳静安賔天視政啓運麗景清風景風應天廣運廣義永芳𤣥德光政金鳳金義金明金烏顯德通逺五鳳寛仁德陽明德迎春宣仁宣陽宣明昭明天福乾明崇光崇明厚載興仁崇禮仁壽元化興敎玉兔𤣥化興善千秋延清天清仁和乾福膺福定鼎宋南薰南普濟宣化廣利安上上善東通津朝陽寅賔改含暉善利順天西大通開逺金耀宣澤通天北景陽永泰安肅永順已上二十門並汴京新城門朱雀南保康崇明麗景東望春宜秋西閶闔景龍安逺天波已上二十門並汴京裏城門宣德即丹鳳改明德又改乾元又改正陽又改宣德左右掖東華即寛仁西華即神獸拱辰即厚載改𤣥武又改拱辰已上六門並汴京宮城門大慶宣德内左右昇龍大慶門外兩廊乾德六年左右日精大慶左右左右大和大慶殿前兩廊舊金烏玉乾德四年改日華